name: Release

# Pushing a tag like v0.2 builds the signed release APK and publishes a GitHub Release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is a commit on master and names the app's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$name" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME but versionName is $name"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.BREAKFAST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::The BREAKFAST_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BREAKFAST_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signed release APK
        env:
          BREAKFAST_KEYSTORE_PASSWORD: ${{ secrets.BREAKFAST_KEYSTORE_PASSWORD }}
          BREAKFAST_KEY_ALIAS: ${{ secrets.BREAKFAST_KEY_ALIAS }}
          BREAKFAST_KEY_PASSWORD: ${{ secrets.BREAKFAST_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "breakfast-${GITHUB_REF_NAME}.apk"
          sha256sum "breakfast-${GITHUB_REF_NAME}.apk" > "breakfast-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("breakfast-${GITHUB_REF_NAME}.apk" "breakfast-${GITHUB_REF_NAME}.apk.sha256")
          # A re-run replaces the files of the release it already made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "Breakfast ${GITHUB_REF_NAME}" --generate-notes \
              $([[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease)
          fi

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
